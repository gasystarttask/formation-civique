name: Déploiement Vercel

# Production : push sur main -> https://formation-civique.rrahajason.space
# Preview    : pull request vers main -> URL de preview en commentaire de la PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # commentaire avec le lien de preview

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer la CLI Vercel
        run: npm install --global vercel@latest

      - name: Récupérer la configuration Vercel
        env:
          TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
        run: vercel pull --yes --environment=$TARGET --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        env:
          PROD: ${{ github.event_name != 'pull_request' && '--prod' || '' }}
        run: vercel build $PROD --token=${{ secrets.VERCEL_TOKEN }}

      - name: Déployer
        id: deploy
        env:
          PROD: ${{ github.event_name != 'pull_request' && '--prod' || '' }}
        run: |
          # --archive=tgz : un seul fichier envoyé (limite Vercel : 40 000 fichiers / jour)
          url=$(vercel deploy --prebuilt --archive=tgz $PROD --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Déployé : $url" >> "$GITHUB_STEP_SUMMARY"

      # Un seul commentaire par PR, mis à jour à chaque déploiement.
      # Ignoré pour Dependabot (jeton en lecture seule sur ses PR).
      - name: Commenter le lien de preview
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- vercel-preview -->"
          body="$marker
          ### Preview Vercel

          | | |
          |---|---|
          | Lien | $URL |
          | Commit | \`${SHA:0:7}\` |
          | Mis à jour | $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M') |"
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

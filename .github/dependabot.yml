version: 2
updates:
  # Dépendances npm (package.json / package-lock.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Mises à jour mineures et correctifs regroupés en une seule PR
      npm-minor-patch:
        update-types: [minor, patch]

  # Actions utilisées dans .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
